<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Relevé GPS d'ouvrages Eau, Assainissement, SPANC et Voirie vers un fichier GeoJSON par filière, prêt pour QGIS.">
  <meta name="color-scheme" content="light dark">
  <!-- Réécrite par app.js selon le thème choisi dans Configuration. -->
  <meta name="theme-color" content="#1b1340">
  <title>Groma</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS ignore le manifeste : nom, icône et mode plein écran passent par ces
       balises, sans quoi « Sur l'écran d'accueil » produit un simple marque-page. -->
  <link rel="apple-touch-icon" href="icons/icone-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- L'en-tête est une bande d'encre dans les deux thèmes : l'heure et la
       batterie s'y écrivent en blanc, la page passe sous la barre d'état. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Groma">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- En-tête et onglets collent ensemble : évite d'aligner la nav sur une hauteur codée en dur. -->
  <div class="barre-haute">
    <header class="entete">
      <h1>
        <!-- Le logo de l'application, le même que l'icône de l'écran d'accueil :
             on reconnaît d'un coup d'œil l'application qu'on vient d'ouvrir. -->
        <img class="marque" src="favicon.svg" alt="" width="36" height="36">
        Groma
      </h1>
      <span class="badge-fichier" id="badge-fichier" data-etat="neutre">…</span>
    </header>

    <nav class="onglets" id="onglets" role="tablist" aria-label="Filières"></nav>
  </div>

  <main id="vues"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/lambert93.js"></script>
  <script src="js/carte.js"></script>
  <script src="js/config.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/geojson.js"></script>
  <script src="js/store.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Après le chargement : l'installation du cache ne doit pas disputer la
    // bande passante au démarrage de l'application. Un échec est sans
    // conséquence — Groma fonctionne à l'identique sans service worker, il
    // n'apporte que l'installation et le hors-ligne.
    if ('serviceWorker' in navigator) {
      // Une page déjà contrôlée qui change de worker vient de recevoir une
      // nouvelle version : elle se recharge pour l'afficher, au lieu d'attendre
      // l'ouverture suivante. Sauf pendant une mesure — un rechargement
      // perdrait la saisie en cours ; la nouvelle version attendra.
      var dejaControlee = !!navigator.serviceWorker.controller;
      var rechargee = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!dejaControlee || rechargee || document.body.hasAttribute('data-modale')) return;
        rechargee = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
